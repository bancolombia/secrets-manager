dependencies {
    api project(":secrets-manager-api")
    implementation 'software.amazon.awssdk:secretsmanager'
    implementation 'software.amazon.awssdk:sts'
    implementation 'io.projectreactor.addons:reactor-extra:3.7.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.3.1'
    implementation 'io.projectreactor:reactor-core:3.9.0'
    testImplementation 'io.projectreactor:reactor-test:3.9.0'
    implementation platform('software.amazon.awssdk:bom:2.59.7')
}

ext {
    artifactId = 'aws-secrets-manager-async'
    artifactDescription = 'Secrets Manager'
}